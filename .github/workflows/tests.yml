name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      POSTGRES_PASSWORD: ci_only_password
      RUN_DB_TESTS: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: brokerage_test
          POSTGRES_USER: brokerage
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U brokerage -d brokerage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Initialize test database
        run: |
          for migration in sql/0*.sql; do
            docker exec -i "${{ job.services.postgres.id }}" psql -U brokerage -d brokerage_test -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Run unit and database tests
        run: python -m unittest discover -s tests -v
